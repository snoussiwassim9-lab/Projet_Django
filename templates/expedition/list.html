<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Expeditions</title>
</head>
<body>
    <h1>Expeditions List</h1>
    <ul>
    {% for expedition in list %}
        <li>
            <a href="{% url 'detail' expedition.id %}">
                {{expedition.reference}} - {{expedition.entreprise}}
            </a>
        </li>
        {% empty %}
            No Expedtion

    {% endfor %}
    </ul>

</body>
</html>
